<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>GujjuTools — Free Online Tools</title>
    <link rel="icon" type="image/png" href="img/Comp_logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">


    <style>
        body {
            background: linear-gradient(135deg, #eef2f7, #e6ebf3);
        }

        .passbox {
            max-width: 420px;
            margin: 100px auto;
            background: rgba(255, 255, 255, .85);
            backdrop-filter: blur(12px);
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .15);
        }

        .passbox h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .output {
            display: flex;
            gap: 10px;
        }

        .output input {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-size: 18px;
        }

        .output button {
            padding: 12px 18px;
        }

        .options {
            margin-top: 20px;
        }

        .options label {
            display: block;
            margin: 8px 0;
        }

        .strength {
            margin-top: 15px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <script src="navbar.js"></script>

    <div class="passbox">
        <h2>Password Generator</h2>

        <div class="output">
            <input id="password" readonly>
            <button onclick="copyPass()">Copy</button>
        </div>

        <div class="options">
            <label>Length: <span id="lenVal">12</span></label>
            <input type="range" min="4" max="32" value="12" id="length" oninput="updateLen()">

            <label><input type="checkbox" id="upper" checked> Uppercase</label>
            <label><input type="checkbox" id="lower" checked> Lowercase</label>
            <label><input type="checkbox" id="numbers" checked> Numbers</label>
            <label><input type="checkbox" id="symbols"> Symbols</label>

            <button style="margin-top:15px;width:100%" onclick="generate()">Generate Password</button>

            <div class="strength" id="strength">Strength: —</div>
        </div>
    </div>

    <script src="footer.js"></script>

    <script>
        const password = document.getElementById("password");
        const lengthSlider = document.getElementById("length");
        const lenVal = document.getElementById("lenVal");

        function updateLen() {
            lenVal.innerText = lengthSlider.value;
        }

        function generate() {

            const upper = document.getElementById("upper").checked;
            const lower = document.getElementById("lower").checked;
            const numbers = document.getElementById("numbers").checked;
            const symbols = document.getElementById("symbols").checked;

            const upperSet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            const lowerSet = "abcdefghijklmnopqrstuvwxyz";
            const numberSet = "0123456789";
            const symbolSet = "!@#$%^&*()_+{}[]<>?";

            let chars = "";

            if (upper) chars += upperSet;
            if (lower) chars += lowerSet;
            if (numbers) chars += numberSet;
            if (symbols) chars += symbolSet;

            if (chars.length === 0) {
                alert("Choose at least one option");
                return;
            }

            let length = parseInt(lengthSlider.value);
            let pass = "";

            for (let i = 0; i < length; i++) {
                pass += chars[Math.floor(Math.random() * chars.length)];
            }

            password.value = pass;
            checkStrength(pass);
        }

        function checkStrength(p) {
            let score = 0;

            if (p.length >= 12) score++;
            if (/[A-Z]/.test(p)) score++;
            if (/[0-9]/.test(p)) score++;
            if (/[^A-Za-z0-9]/.test(p)) score++;

            const s = document.getElementById("strength");

            if (score <= 1) {
                s.innerText = "Strength: Weak";
                s.style.background = "#ffe5e5";
            }
            else if (score == 2) {
                s.innerText = "Strength: Medium";
                s.style.background = "#fff4cc";
            }
            else {
                s.innerText = "Strength: Strong";
                s.style.background = "#d4ffd9";
            }
        }

        function copyPass() {
            if (!password.value) return;
            navigator.clipboard.writeText(password.value);
            alert("Copied!");
        }

        /* initial setup */
        updateLen();
        generate();
    </script>
    <script src="transition.js"></script>

<div id="loader">
    <div class="spinner"></div>
    <p>Processing your file...</p>
</div>


</body>

</html>
