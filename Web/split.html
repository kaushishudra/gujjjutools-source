<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Split PDF - GujjuTools</title>

<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<script src="navbar.js"></script>

<div class="tool-wrapper">

<h1 class="tool-title">Split PDF</h1>
<p class="tool-desc">Extract pages from your PDF file</p>

<div class="upload-box" id="dropArea">
    <div class="upload-icon">📄</div>
    <p><b>Click or drag PDF here</b></p>
    <input type="file" id="files" accept=".pdf" hidden>
</div>

<div class="file-list" id="fileList"></div>

<button type="button" class="action-btn" onclick="splitPDF()">Split PDF</button>

</div>

<script src="script.js?v=3"></script>
<script src="footer.js"></script>
<script src="transition.js"></script>

<script>
const dropArea=document.getElementById("dropArea");
const fileInput=document.getElementById("files");
const fileList=document.getElementById("fileList");

/* open file picker */
dropArea.onclick=()=>fileInput.click();

/* manual select */
fileInput.addEventListener("change",()=>{
    if(fileInput.files.length>0){
        const dt=new DataTransfer();
        dt.items.add(fileInput.files[0]);   // force single file
        fileInput.files=dt.files;
        showFile();
    }
});

/* drag over */
dropArea.addEventListener("dragover",e=>{
    e.preventDefault();
    dropArea.classList.add("drag");
});

/* drag leave */
dropArea.addEventListener("dragleave",()=>dropArea.classList.remove("drag"));

/* drop */
dropArea.addEventListener("drop",e=>{
    e.preventDefault();
    dropArea.classList.remove("drag");

    const dt=new DataTransfer();
    dt.items.add(e.dataTransfer.files[0]); // only first PDF
    fileInput.files=dt.files;

    showFile();
});

/* display filename */
function showFile(){
    fileList.innerHTML="📎 "+fileInput.files[0].name;
}
</script>
<!-- Loader -->
<div id="loader">
    <div class="spinner"></div>
    <p>Processing your file...</p>
</div>

</body>
</html>
